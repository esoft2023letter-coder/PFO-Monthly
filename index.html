<title>자산 현황 (상세)</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { display: flex; align-items: center; justify-content: center; background: #F4F5F7; color: #1F2328;
         font-family: -apple-system, BlinkMacSystemFont, system-ui, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif; }
  form { width: min(340px, 90vw); background: #fff; border: 1px solid #DDE1E6; border-radius: 14px; padding: 26px 22px 20px; text-align: center; }
  .lock { font-size: 30px; }
  h1 { font-size: 19px; margin: 6px 0 4px; }
  p { font-size: 13px; color: #6B7280; margin: 0 0 16px; }
  input[type=password] { width: 100%; font-size: 18px; padding: 11px 12px; border: 1px solid #C9CED6; border-radius: 9px; text-align: center; letter-spacing: .15em; }
  input[type=password]:focus { outline: 2px solid #4F81BD; border-color: transparent; }
  label { display: flex; gap: 6px; align-items: center; justify-content: center; font-size: 13px; color: #4B5563; margin: 12px 0 14px; }
  button { width: 100%; font-size: 16px; font-weight: 600; padding: 11px; border: 0; border-radius: 9px; background: #2F4A6D; color: #fff; cursor: pointer; }
  button:disabled { opacity: .6; }
  .err { color: #D93025; font-size: 13px; min-height: 18px; margin-top: 10px; }
</style>
</head>

</form>
