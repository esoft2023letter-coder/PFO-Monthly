<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>자산 현황 (상세)</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { display: flex; align-items: center; justify-content: center; background: #F4F5F7; color: #1F2328;
         font-family: -apple-system, BlinkMacSystemFont, system-ui, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif; }
  form { width: min(340px, 90vw); background: #fff; border: 1px solid #DDE1E6; border-radius: 14px; padding: 26px 22px 20px; text-align: center; }
  .lock { font-size: 30px; }
  h1 { font-size: 19px; margin: 6px 0 4px; }
  p { font-size: 13px; color: #6B7280; margin: 0 0 16px; }
  input[type=password] { width: 100%; font-size: 18px; padding: 11px 12px; border: 1px solid #C9CED6; border-radius: 9px; text-align: center; letter-spacing: .15em; }
  input[type=password]:focus { outline: 2px solid #4F81BD; border-color: transparent; }
  label { display: flex; gap: 6px; align-items: center; justify-content: center; font-size: 13px; color: #4B5563; margin: 12px 0 14px; }
  button { width: 100%; font-size: 16px; font-weight: 600; padding: 11px; border: 0; border-radius: 9px; background: #2F4A6D; color: #fff; cursor: pointer; }
  button:disabled { opacity: .6; }
  .err { color: #D93025; font-size: 13px; min-height: 18px; margin-top: 10px; }
</style>
</head>

<form id="f" autocomplete="off">

  <label><input id="rm" type="checkbox"> 이 기기에서 기억하기</label>
  <button id="b" type="submit">열기</button>
  <div class="err" id="e"></div>
</form>

const K = "pfo-key-v1-" + D.s.slice(0, 8);
const u8 = b => Uint8Array.from(atob(b), c => c.charCodeAt(0));
const b64 = a => btoa(String.fromCharCode(...new Uint8Array(a)));
async function derive(pw) {
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveBits"]);
  return crypto.subtle.deriveBits({ name: "PBKDF2", hash: "SHA-256", salt: u8(D.s), iterations: D.n }, base, 256);
}
async function openWith(raw) {
  const key = await crypto.subtle.importKey("raw", raw, "AES-GCM", false, ["decrypt"]);
  const pt = await crypto.subtle.decrypt({ name: "AES-GCM", iv: u8(D.i) }, key, u8(D.c));
  const html = new TextDecoder().decode(pt);
  document.open(); document.write(html); document.close();
}
(async () => {
  let saved = null;
  try { saved = localStorage.getItem(K); } catch (e) {}
  if (saved) {
    try { await openWith(u8(saved)); return; } catch (e) { try { localStorage.removeItem(K); } catch (e2) {} }
  }
})();
document.getElementById("f").addEventListener("submit", async ev => {
  ev.preventDefault();
  const b = document.getElementById("b"), e = document.getElementById("e");
  b.disabled = true; b.textContent = "여는 중…"; e.textContent = "";
  try {
    const raw = await derive(document.getElementById("pw").value);
    await openWith(raw);
    if (document.getElementById("rm") && document.getElementById("rm").checked) {}
    try { if (remember) localStorage.setItem(K, b64(raw)); } catch (x) {}
  } catch (x) {
    e.textContent = "비밀번호가 맞지 않아요.";
    b.disabled = false; b.textContent = "열기";
  }
});
let remember = false;
document.getElementById("rm").addEventListener("change", ev => { remember = ev.target.checked; });
